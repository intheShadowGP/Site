# GP — nginx sample (static hosting of dist/)
# Source of truth for the policy: config/security.mjs. Keep in sync.
# Replace example.com, certificate paths and root before use.

# Minimal logging: no access log, errors only (see docs/PRIVACY.md).
# If you need access logs, prefer an anonymised IP format and short rotation.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/gp/dist;
    index index.html;

    access_log off;
    error_log /var/log/nginx/gp.error.log warn;

    server_tokens off;
    charset utf-8;
    autoindex off;

    # Security headers (also on error pages: "always")
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; worker-src 'none'; child-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # Only GET/HEAD make sense on a static site
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Never serve hidden files or the Netlify/Cloudflare headers file
    location ~ /\.  { deny all; return 404; }
    location = /_headers { return 404; }

    # Fingerprinted assets: cache forever. add_header in a location replaces
    # the server-level set, so the security headers are included again.
    location /_assets/ {
        include /etc/nginx/snippets/gp-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}

# /etc/nginx/snippets/gp-security-headers.conf should contain the same
# add_header lines as above, without the Cache-Control line.
